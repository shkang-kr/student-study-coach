<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-0H8Z74VG4D9jBZ6I5CLkh8w1AM1NWDd+NiP90J1itbw='; style-src 'unsafe-inline'; img-src 'self' blob: data:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-src 'none'">

<title>학습 코치</title>
<style>
:root{
  --paper:#F3F6FA; --sheet:#FFFFFF; --grid:#DFE6F0;
  --ink:#1C2230; --blue:#1B3FA0; --blue-soft:#E4EBFA;
  --red:#D3263F; --red-soft:#FDE8EB; --hl:#FFE15A; --mute:#5B6475; --ok:#1E8A5A; --ok-soft:#E5F5EC;
  --serif:"AppleMyungjo","Noto Serif KR","Nanum Myeongjo",Batang,serif;
  --sans:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;line-height:1.55;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;height:100%}
.app{width:100%;max-width:480px;height:100vh;height:100dvh;background:var(--sheet);display:flex;flex-direction:column;overflow:hidden}
.top{padding:calc(8px + env(safe-area-inset-top)) 14px 10px;border-bottom:2px solid var(--ink);background:var(--hl);display:flex;flex-direction:column;gap:8px}
.top .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top b{font-family:var(--serif);font-size:16px}
.gear{min-height:36px;padding:0 12px;border:2px solid var(--ink);border-radius:99px;font-size:13px;font-weight:700;background:#fff}
.gear[aria-pressed=true]{background:var(--ink);color:#fff}
.role{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.role button{min-height:40px;font-size:14px;font-weight:700}
.role button[aria-pressed=true]{background:var(--ink);color:#fff}
.view{flex:1;padding:16px 16px 28px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tabs{display:flex;border-top:2px solid var(--ink);background:#fff;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;min-height:52px;font-weight:700;font-size:12.5px;color:var(--mute)}
.tabs button[aria-selected=true]{color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
h1{font-family:var(--serif);font-size:23px;line-height:1.3;margin-bottom:4px}
h2{font-family:var(--serif);font-size:17px;margin:22px 0 8px}
.sub{color:var(--mute);font-size:13px}
.slip{border:2px solid var(--ink);border-radius:6px;margin-top:14px}
.slip .row{display:grid;grid-template-columns:44px 1fr 44px 32px;gap:6px;align-items:center;min-height:46px;padding:6px 12px;border-bottom:1px dashed var(--grid);width:100%;text-align:left}
.slip .row:last-child{border-bottom:0}
.slip .nm{font-family:var(--serif);font-weight:700}
.slip .sc{font-weight:800;color:var(--blue);font-size:19px;text-align:right}
.lv{width:26px;height:26px;border:2px solid var(--blue);border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--blue);font-size:12px}
.lv.low{border-color:var(--red);color:var(--red)}
.up{color:var(--ok);font-weight:700}.down{color:var(--red);font-weight:700}
.pen{margin-top:14px;padding:12px 14px 12px 16px;background:var(--red-soft);border-left:4px solid var(--red);border-radius:0 8px 8px 0;color:#7A1020;font-size:14.5px;overflow-wrap:anywhere}
.pen b{color:var(--red);font-family:var(--serif)}
.pen mark{background:none;color:inherit;text-decoration:underline wavy var(--red);text-underline-offset:4px}
.pen.good{background:var(--ok-soft);border-color:var(--ok);color:#0F4D31}.pen.good b{color:var(--ok)}
.pen.blue{background:var(--blue-soft);border-color:var(--blue);color:#13296B}.pen.blue b{color:var(--blue)}
.pen.good mark,.pen.blue mark{text-decoration-color:currentColor}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1.5px solid var(--ink);margin:0 4px 4px 0;background:#fff}
.task{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:48px;padding:11px 12px;border:2px solid var(--ink);border-radius:10px;margin-bottom:8px;background:#fff}
.task .box{flex:none;width:24px;height:24px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-weight:900;color:#fff;margin-top:2px}
.task[aria-checked=true]{background:var(--blue-soft);border-color:var(--blue)}
.task[aria-checked=true] .box{background:var(--blue);border-color:var(--blue)}
.task[aria-checked=true] .t{text-decoration:line-through;text-decoration-color:var(--blue)}
.task .t{font-weight:700}.task .d{font-size:13px;color:var(--mute)}
.bar{height:12px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hl);border-right:2px solid var(--ink);transition:width .4s}
.chips{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.chips button{min-height:40px;padding:0 14px;border:2px solid var(--ink);border-radius:99px;font-weight:700;font-size:14px;background:#fff}
.chips button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.chips button.sub{border-style:dashed;font-weight:600}
.chart{border:2px solid var(--ink);border-radius:8px;padding:8px;background:#fff}
.scroll{overflow-x:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:4px;flex-wrap:wrap}
.comp{display:grid;grid-template-columns:70px 1fr 54px;gap:6px 8px;align-items:center;font-size:13.5px;margin-top:8px}
.stack{display:flex;height:14px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.stack i{display:block;height:100%}
.card{border:2px solid var(--ink);border-radius:10px;padding:12px;margin-top:10px;background:#fff;position:relative;overflow-wrap:anywhere}
.trait{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.trait div{border:2px solid var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff}
.trait b{display:block;font-size:15px;font-family:var(--serif)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
th{font-weight:700;text-align:left;font-size:12px;color:var(--mute);padding:4px;border-bottom:2px solid var(--ink)}
td{padding:9px 4px;border-bottom:1px dashed var(--grid)}
tr.pick{background:var(--hl)}
tbody tr[data-pick]{cursor:pointer}
.flag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;border:1.5px solid var(--red);color:var(--red);background:var(--red-soft);white-space:nowrap}
.flag.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.flag.watch{border-color:#9A6B00;color:#7A5400;background:#FFF4CC}
.goal{margin:10px 0;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:#fff}
.goal .h{display:flex;justify-content:space-between;font-weight:700}
.goal input[type=range]{width:100%;accent-color:var(--blue);margin:8px 0 2px;min-height:32px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:8px 0;border-bottom:1px dashed var(--grid);width:100%;text-align:left}
.sw{width:46px;height:26px;border:2px solid var(--ink);border-radius:99px;position:relative;background:#fff;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:left .2s}
.tg[aria-checked=true] .sw{background:var(--hl)}
.tg[aria-checked=true] .sw::after{left:22px}
.q{margin:6px 0;padding:10px 12px;background:var(--hl);border-radius:8px;font-weight:700;font-size:14.5px}
.draft{white-space:pre-wrap;font-size:14px;background:#fff;border:2px dashed var(--ink);border-radius:8px;padding:10px 12px;margin-top:8px}
.btn{margin-top:8px;min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:99px;font-weight:700;background:#fff;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.btn.main{background:var(--hl)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px;margin-top:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.btns .btn{margin-top:0}
.in{width:100%;padding:8px 10px;border:2px solid var(--ink);border-radius:8px;background:#fff;margin-top:4px;min-height:44px}
.fr{display:grid;grid-template-columns:54px 1fr 1fr;gap:6px;align-items:center;margin:6px 0;font-size:14px}
.fr input{padding:6px 8px;border:2px solid var(--ink);border-radius:8px;width:100%;min-width:0;min-height:44px}
.std{display:grid;grid-template-columns:1fr 90px 40px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.qc{border:2px solid var(--ink);border-radius:10px;padding:12px;margin:10px 0;background:#fff}
.qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:13px}
.sel2 label{display:block}
.sel2 select,.er select,.wr select{width:100%;padding:6px;border:2px solid var(--ink);border-radius:8px;background:#fff;margin:2px 0;min-height:44px}
.trace{font-size:13.5px;color:var(--mute);margin-top:8px}
.day{margin:14px 0 4px}
.slot{border:2px solid var(--ink);border-radius:10px;padding:12px;margin:10px 0;background:#fff;position:relative}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.vh:focus-visible + label{outline:3px solid var(--blue);outline-offset:2px}
label.btn{cursor:pointer}
.ths{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.th{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;font-size:13px}
.th img,.th .pdf{width:48px;height:48px;object-fit:cover;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:12px;background:#fff}
.th .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt{border:2px solid var(--ink);border-radius:8px;padding:8px 10px;margin:8px 0;background:#fff}
.dt summary{font-weight:700;cursor:pointer;min-height:36px;display:flex;align-items:center}
.big{width:100%;display:block;margin-top:8px;border:1px solid var(--grid)}
.er{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center;margin:4px 0;font-size:14px}
.er.head{font-size:12px;color:var(--mute);font-weight:700}
.wr{display:grid;grid-template-columns:44px 1fr;gap:6px 8px;align-items:center;margin:10px 0;padding-bottom:10px;border-bottom:1px dashed var(--grid)}
.wr .in,.wr select{grid-column:2;width:100%;margin:0}
.rules{padding-left:18px;font-size:13.5px}.rules li{margin:4px 0}
.fmt{font-size:12px;width:100%}.fmt td,.fmt th{padding:5px 4px;vertical-align:top;overflow-wrap:anywhere}
.fmt code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#EEF2F8;padding:0 3px;border-radius:3px}
.errs{margin-top:8px;font-size:13px;overflow-wrap:anywhere}
.errs li{margin:3px 0 3px 18px}
.notes{display:none;width:350px;position:sticky;top:24px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:18px;box-shadow:6px 6px 0 var(--blue)}
.notes h3{font-family:var(--serif);font-size:17px;margin-bottom:6px}
.notes p{font-size:14px;margin-bottom:10px}
.notes .k{font-size:12.5px;color:var(--mute)}
.notes ul{padding-left:18px;font-size:13.5px;margin-bottom:8px}
.notes hr{border:0;border-top:1px dashed var(--ink);margin:12px 0}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.g2 label,.g3 label,.lb,.srow label{display:block;font-size:13px}
.g2 input,.g3 input,.g3 select,.g2 select,.srow .g2 input,.srow .g3 input{width:100%;padding:6px 8px;border:2px solid var(--ink);border-radius:8px;min-height:44px;background:#fff;margin-top:2px}
.srow{border:2px solid var(--ink);border-radius:10px;padding:12px;margin:10px 0;background:#fff}
.srow label{margin-top:8px}
.ev{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--grid);font-size:14px}
.ev .dd{font-weight:800;color:var(--blue);font-size:14px}
.evb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.upd{background:var(--ink);color:#fff;padding:8px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.upd[hidden]{display:none}
.upd .btn{color:var(--ink)}
.ver{font-size:11px;color:var(--mute);margin-left:6px;font-weight:700}
textarea.in{resize:vertical;font-size:14px}
@media(min-width:900px){
  body{overflow:auto}
  .stage{height:auto;padding:24px 16px}
  .app{height:min(860px,calc(100vh - 48px));border:2px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink)}
  .notes{display:block}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <main class="app" aria-label="학습 코치 앱">
    <header class="top">
      <div class="r1"><span><b id="ttl">학습 코치</b><span class="ver" id="ver"></span></span><button class="gear" data-role="D" aria-pressed="false">데이터</button></div>
      <div class="role" role="group" aria-label="사용자 전환">
        <button data-role="S" aria-pressed="true">학생</button><button data-role="P" aria-pressed="false">학부모</button><button data-role="T" aria-pressed="false">교사</button>
      </div>
    </header>
    <div class="upd" id="upd" hidden><span>새 버전이 있어요. 저장하지 않은 데이터는 먼저 받아 두세요.</span><button class="btn small" data-reload="1">새로고침</button></div>
    <div class="view" id="view" tabindex="-1"></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="학생 메뉴"></nav>
  </main>
  <aside class="notes" id="notes" aria-live="polite"></aside>
</div>

<script>
'use strict';
/* =====================================================================
   학습 코치 — 프로그램 파일
   - 이 파일에는 학생·학교 데이터가 들어 있지 않아요.
   - 데이터는 별도 JSON 파일로만 불러와요(형식은 아래 SCHEMA가 정의해요).
   - 브라우저 저장소·쿠키를 쓰지 않고, 같은 위치의 파일만 읽어요(CSP로 외부 연결 차단).
   ===================================================================== */
const FORMAT='school-coach-data',VERSION=3,APP_VERSION='3.0.2';
/* 데이터 형식(스키마) 변경 기록. 새 성적표에서 중요한 항목이 발견되면 여기에 버전을 추가하고 SCHEMA와 MIGRATIONS를 함께 고쳐요. */
const SCHEMA_HISTORY=[
 {v:1,app:'1.0.0',date:'2026-11-08',changes:['최초 형식: 시험·과목·점수(객관식/서술형), 학급 비교, 시험지 분석 예시']},
 {v:2,app:'2.0.0',date:'2026-11-08',changes:[
  '성적표(채점 현황) 샘플 4종을 분석해 형식을 확장했어요',
  '시험에 학년·학기·종류를 추가했어요(terms → exams)',
  '점수에 실기(performance)와 성적표 총점(reportedTotal)을 추가해 읽기 오류를 검산해요',
  '성적표에 인쇄된 합계·평균(reported)을 추가했어요',
  '문항별 오답 표기(items): 틀린 문항 번호와 고른 보기, 비운 문항',
  '과목에 성적표의 과목 코드(code)를 추가했어요',
  '스키마에 없는 항목을 따로 담는 extras를 추가했어요(다음 개정의 근거)',
  '이름 변경: scores → results, class.termIds → class.examIds (v1 파일은 자동 변환)']},
 {v:3,app:'3.0.0',date:'2026-11-08',changes:[
  '학사 일정(schedule)을 추가했어요: 날짜·이름·종류. 학교 이름과 홈페이지 주소는 넣지 않아요',
  'AI 도구가 만든 결과를 가져오는 약속(kind: reportCard · schedule · examJudgement)을 정했어요',
  '비밀번호 암호화 파일(school-coach-encrypted)을 지원해요',
  'v2 파일은 그대로 불러올 수 있어요(자동 변환)']}
];
const TYPES={math:'수학·계산형',sci:'과학',lang:'언어(국어·영어)',memo:'암기·서술형'};
const TIP={
 math:{task:'오답을 "개념 부족 / 계산 실수 / 문제 해석"으로 나눠 다시 풀기',min:25,home:'풀이 과정을 말로 설명해 보게 해 주세요'},
 sci :{task:'틀린 문항의 단원 개념도 한 장으로 정리하기',min:20,home:'실험 내용을 일상 예시로 이야기해 보게 해 주세요'},
 memo:{task:'핵심어를 백지에 써 보고 서술형 답안 2개 완성하기',min:15,home:'배운 내용을 3분 동안 설명해 보게 해 주세요'},
 lang:{task:'서술형 쓰기 2문장 + 오답 어휘 정리',min:15,home:'읽은 글의 핵심을 한 문장으로 말해 보게 해 주세요'}
};
const COLORS=['#1B3FA0','#D3263F','#1E8A5A','#B7791F','#7B3FA0','#00A3E0','#E0702B','#5B6475','#A0306B','#3C8D2F'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sg=n=>(n>0?'+':'')+n;

/* ===== 1. 데이터 형식(SCHEMA): 검증·문서·빈 양식이 모두 이 정의에서 나와요 ===== */
const RE_ID=/^[a-z][a-z0-9_]{0,15}$/,RE_ALIAS=/^학생 [A-Z]{1,2}$/;
const CONF=['높음','보통','낮음','읽기 어려움'];
const KINDS={midterm:'중간고사',final:'기말고사',quiz:'단원평가',mock:'모의고사',other:'기타'};
const FREE=(d,max)=>({k:'str',max:max||40,free:true,d});
const SCORE=d=>({k:'int',min:0,max:100,d});
const ITEMNO={k:'int',min:1,max:100,d:'문항 번호'};
const CHOICE={k:'int',min:1,max:5,d:'보기 번호'};

/* 개인정보로 보이는 글을 막는 규칙(자유 입력 글에 적용) */
const PII=[
 [/01[016-9][-\s]?\d{3,4}[-\s]?\d{4}/,'전화번호'],
 [/\d{6}[-\s]?[1-4]\d{6}/,'주민등록번호'],
 [/[\w.+-]+@[\w-]+\.[\w.-]+/,'이메일 주소'],
 [/[<>]/,'특수 문자(< >)'],
 [/[가-힣]{2,}(초|중|고)등?학교/,'실제 학교 이름']
];
const NAMEISH=/[가-힣]{2,4}\s?(학생|선생님)(?![가-힣])/;
const piiHit=s=>{for(const [re,l] of PII)if(re.test(s))return l;return null};

function walk(n,v,p,E,W){
  if(v===null&&n.nullable)return;
  const at=p||'(전체)';
  switch(n.k){
   case 'obj':{
    if(v===null||typeof v!=='object'||Array.isArray(v))return E(at,'객체여야 해요');
    for(const key of Object.keys(v))if(!(key in n.f)){if(LENIENT){delete v[key];W(`${p?p+'.'+key:key}: 허용되지 않는 항목이라 버렸어요`)}else E(p?p+'.'+key:key,'허용되지 않는 항목이에요(개인정보가 섞이지 않도록 정해진 항목만 받아요)')}
    for(const r of n.req||[])if(!(r in v))E(p?p+'.'+r:r,'필수 항목이 없어요');
    for(const key of Object.keys(n.f))if(key in v)walk(n.f[key],v[key],p?p+'.'+key:key,E,W);
    return}
   case 'arr':
    if(!Array.isArray(v))return E(at,'목록이어야 해요');
    if(n.min!=null&&v.length<n.min)E(at,`${n.min}개 이상이어야 해요`);
    if(n.max!=null&&v.length>n.max)E(at,`${n.max}개 이하여야 해요`);
    v.slice(0,n.max!=null?n.max:v.length).forEach((x,i)=>walk(n.of,x,`${p}[${i}]`,E,W));return;
   case 'map':
    if(v===null||typeof v!=='object'||Array.isArray(v))return E(at,'객체여야 해요');
    for(const key of Object.keys(v)){if(!n.keyRe.test(key))E(`${p}.${key}`,'코드 형식이 맞지 않아요');walk(n.of,v[key],`${p}.${key}`,E,W)}return;
   case 'str':
    if(typeof v!=='string')return E(at,'글자여야 해요');
    if(n.max&&v.length>n.max)E(at,`${n.max}자 이하여야 해요`);
    if(n.re&&!n.re.test(v))E(at,'형식이 맞지 않아요. '+(n.d||''));
    if(n.free){const h=piiHit(v);if(h)E(at,`${h}처럼 보이는 글은 받지 않아요`);else if(NAMEISH.test(v))W(`${at}: 사람 이름처럼 보이는 표현이 있는지 확인해 주세요`)}
    return;
   case 'int':
    if(!Number.isInteger(v))return E(at,'정수여야 해요');
    if(n.min!=null&&v<n.min||n.max!=null&&v>n.max)E(at,`${n.min}~${n.max} 사이여야 해요`);return;
   case 'num':
    if(typeof v!=='number'||!isFinite(v))return E(at,'숫자여야 해요');
    if(n.min!=null&&v<n.min||n.max!=null&&v>n.max)E(at,`${n.min}~${n.max} 사이여야 해요`);return;
   case 'bool': if(typeof v!=='boolean')E(at,'true 또는 false여야 해요');return;
   case 'enum': if(!n.v.includes(v))E(at,`다음 중 하나여야 해요: ${n.v.join(', ')}`);return;
  }
}
function validate(d){
  const errors=[],warns=[],E=(p,m)=>{if(errors.length<40)errors.push(`${p}: ${m}`)},W=m=>warns.push(m);
  walk(SCHEMA,d,'',E,W);
  if(errors.length)return {errors,warns};
  const dup=(arr,key,l)=>{const s=new Set();arr.forEach(x=>{if(s.has(x[key]))E(l,`'${x[key]}'가 중복돼요`);s.add(x[key])})};
  dup(d.exams,'id','exams');dup(d.subjects,'id','subjects');
  const T=new Set(d.exams.map(t=>t.id)),S=new Set(d.subjects.map(s=>s.id)),seen=new Set(),sums={};
  d.results.forEach((r,i)=>{
    if(!T.has(r.exam))E(`results[${i}].exam`,`exams에 없는 시험 코드예요: ${r.exam}`);
    if(!S.has(r.subject))E(`results[${i}].subject`,`subjects에 없는 과목 코드예요: ${r.subject}`);
    const total=r.objective+r.written+(r.performance||0);
    if(total>100)E(`results[${i}]`,'객관식+서술형+실기가 100점을 넘어요');
    const k=r.exam+'|'+r.subject;if(seen.has(k))E(`results[${i}]`,'같은 시험·과목 점수가 두 번 나와요');seen.add(k);
    if(r.reportedTotal!=null&&r.reportedTotal!==total)W(`results[${i}]: 입력한 합 ${total}점과 성적표 총점 ${r.reportedTotal}점이 달라요`);
    const x=sums[r.exam]=sums[r.exam]||{s:0,n:0};x.s+=total;x.n++;
  });
  d.exams.forEach((t,i)=>{
    const x=sums[t.id];if(!t.reported||!x)return;
    if(t.reported.sum!=null&&t.reported.sum!==x.s)W(`exams[${i}]: 점수 합 ${x.s}점과 성적표 합계 ${t.reported.sum}점이 달라요`);
    if(t.reported.average!=null&&Math.abs(t.reported.average-x.s/x.n)>0.01)W(`exams[${i}]: 평균 ${(x.s/x.n).toFixed(2)}와 성적표 평균 ${t.reported.average}가 달라요`);
  });
  const ipair=new Set();
  (d.items||[]).forEach((it,i)=>{
    if(!T.has(it.exam))E(`items[${i}].exam`,'exams에 없는 시험 코드예요');
    if(!S.has(it.subject))E(`items[${i}].subject`,'subjects에 없는 과목 코드예요');
    const k=it.exam+'|'+it.subject;if(ipair.has(k))E(`items[${i}]`,'같은 시험·과목이 두 번 나와요');ipair.add(k);
    const ns=new Set();
    it.wrong.forEach(w=>{
      if(ns.has(w.n))E(`items[${i}].wrong`,`문항 ${w.n}가 중복돼요`);ns.add(w.n);
      if(it.count&&w.n>it.count)E(`items[${i}].wrong`,`문항 ${w.n}가 전체 문항 수(${it.count})보다 커요`);
      if(new Set(w.chosen).size!==w.chosen.length)E(`items[${i}].wrong`,`문항 ${w.n}의 보기가 중복돼요`);
    });
    (it.blank||[]).forEach(n=>{if(ns.has(n))E(`items[${i}].blank`,`문항 ${n}가 틀린 문항과 겹쳐요`);if(it.count&&n>it.count)E(`items[${i}].blank`,`문항 ${n}가 전체 문항 수보다 커요`)});
  });
  (d.extras||[]).forEach((x,i)=>{
    if(x.exam&&!T.has(x.exam))E(`extras[${i}].exam`,'exams에 없는 시험 코드예요');
    if(x.subject&&!S.has(x.subject))E(`extras[${i}].subject`,'subjects에 없는 과목 코드예요');
    if(IDENT.test(x.label))E(`extras[${i}].label`,'이름·학번 같은 식별 항목은 받지 않아요');
  });
  if(d.class){
    d.class.examIds.forEach((t,i)=>{if(!T.has(t))E(`class.examIds[${i}]`,`exams에 없는 시험 코드예요: ${t}`)});
    const names=new Set();
    d.class.students.forEach((s,i)=>{
      if(names.has(s.alias))E(`class.students[${i}].alias`,'학생 별칭이 중복돼요');names.add(s.alias);
      for(const [sid,arr] of Object.entries(s.scores)){
        if(!S.has(sid))E(`class.students[${i}].scores.${sid}`,'subjects에 없는 과목 코드예요');
        if(arr.length!==d.class.examIds.length)E(`class.students[${i}].scores.${sid}`,`점수 개수가 examIds(${d.class.examIds.length}개)와 달라요`);
      }
    });
  }
  (d.examAnalyses||[]).forEach((a,i)=>{
    const nos=new Set();a.questions.forEach(q=>{if(nos.has(q.no))E(`examAnalyses[${i}].questions`,`문항 번호 ${q.no}가 중복돼요`);nos.add(q.no)});
    (a.tasks||[]).forEach((t,j)=>{if(t.q!==0&&!nos.has(t.q))E(`examAnalyses[${i}].tasks[${j}].q`,'없는 문항 번호예요')});
  });
  const sk=new Set();
  (d.schedule||[]).forEach((e,i)=>{
    if(!isDate(e.date))E(`schedule[${i}].date`,'없는 날짜예요');
    if(e.endDate!=null&&!isDate(e.endDate))E(`schedule[${i}].endDate`,'없는 날짜예요');
    else if(e.endDate!=null&&e.endDate<e.date)E(`schedule[${i}].endDate`,'끝 날짜가 시작 날짜보다 빨라요');
    const k=e.date+'|'+e.title;if(sk.has(k))W(`schedule[${i}]: 같은 날짜·이름의 일정이 중복돼요`);sk.add(k);
  });

/* 파서 결과 검사: 허용되지 않는 항목(이름 등)은 버리고, 나머지가 형식에 맞는지 봐요 */

/* 이전 버전 파일을 새 형식으로 바꾸는 자리. 형식이 바뀌면 여기에 변환 함수를 추가해요(MIGRATIONS[이전버전]). */
const IDENT=/이름|성명|학번|주민|생년|주소|연락|전화|이메일|학교명|^반$|^번호$|출석번호/;

};
function migrate(d){

}
/* 형식 설명표(화면에 보여줘요) */
function docRows(n,p,out){
  const kids=n.k==='obj'?Object.entries(n.f).map(([k,c])=>[p?p+'.'+k:k,c,(n.req||[]).includes(k)])
    :n.k==='arr'?[[p+'[]',n.of,true]]:n.k==='map'?[[p+'{코드}',n.of,true]]:[];
  kids.forEach(([path,c,req])=>{
    const tl={obj:'객체',arr:'목록',map:'맵',str:'글자',int:'정수',num:'숫자',bool:'참/거짓',enum:'선택값'}[c.k];
    let rule='';
    if(c.k==='str'&&c.re)rule=c.re.source;else if(c.k==='str'&&c.max)rule='최대 '+c.max+'자';
    else if(c.k==='int'||c.k==='num')rule=`${c.min}~${c.max}`;
    else if(c.k==='enum')rule=c.v.join(' | ');
    else if(c.k==='arr'&&(c.min!=null||c.max!=null))rule=`${c.min!=null?c.min:0}~${c.max!=null?c.max:'∞'}개`;
    out.push({path,tl:tl+(c.nullable?'(null 가능)':''),req,d:c.d||'',rule});

  });

}

/* ===== 3. 분석 엔진(규칙 기반) ===== */
const valid=a=>a.map((v,i)=>[v,i]).filter(x=>x[0]!=null);
const lvl=v=>v>=90?'A':v>=80?'B':v>=70?'C':v>=60?'D':'E';
function analyze(k){
  const o=SUB[k],v=valid(o.s),L=v[v.length-1],P=v[v.length-2],F=v[0];
  const d=P?L[0]-P[0]:0,adj=P?(L[1]-P[1]===1):false,span=L[0]-F[0];
  let level='steady';
  if(d<=-10)level='focus';else if(d<=-5)level='watch';else if(span>=8&&d>=0)level='rise';
  const cl=o.c[L[1]],cp=P?o.c[P[1]]:cl;
  return {k,now:L[0],prev:P?P[0]:null,pi:P?P[1]:null,d,adj,span,first:F[0],level,urgency:d*(adj?1:0.7),
    stale:L[1]!==TERMS.length-1,li:L[1],cp,cl,dO:cl[0]-cp[0],dS:cl[1]-cp[1],max:Math.max(...v.map(x=>x[0]))};
}
const ALL=()=>KEYS.map(analyze);
const byUrgency=()=>ALL().sort((a,b)=>a.urgency-b.urgency);
function commonAvg(){
  const L=TERMS.length-1;

    const ks=KEYS.filter(k=>SUB[k].s[p]!=null&&SUB[k].s[L]!=null);
    if(ks.length>=2){const m=ks.reduce((t,k)=>t+SUB[k].s[p],0)/ks.length,f=ks.reduce((t,k)=>t+SUB[k].s[L],0)/ks.length;return {ks,m,f,d:f-m,pn:TERMS[p]}}

}
function coach(k){

  const ref=a.adj?'직전 시험':esc(TERMS[a.pi]);

   focus:`${n}: ${ref}보다 <mark>${-a.d}점 내렸어요</mark>(${a.prev}→${a.now}).`,
   watch:`${n}: ${ref}보다 ${-a.d}점 내려갔어요(${a.prev}→${a.now}).`,
   rise:`${n}: ${a.first}점에서 ${a.now}점으로 <mark>꾸준히 올랐어요</mark>.`,
   steady:`${n}: ${a.now}점으로 안정적이에요.`}[a.level];
  const down=a.level==='focus'||a.level==='watch';let why='';
  if(a.dO<=-8&&down&&a.dS>=0)why=` 줄어든 점수는 대부분 <mark>객관식(${a.dO}점)</mark>이고, 서술형은 ${sg(a.dS)}점이에요. 실력 자체보다 선택형 문항의 실수나 개념 혼동이 원인일 수 있어요.`;
  else if(a.dO<=-8&&down)why=` 객관식(${a.dO}점)과 서술형(${a.dS}점)이 모두 줄었어요. 개념 이해부터 다시 확인해요.`;

function chart(keys,o={}){

  g+=TERMS.map((t,i)=>`<text x="${x(i)}" y="${H-10}" font-size="10" text-anchor="middle" fill="#5B6475">${esc(t)}</text>`).join('');

    pts.forEach(q=>body+=`<circle cx="${x(q[1])}" cy="${y(q[0])}" r="3" fill="#1C2230"/>`);
  }
  keys.forEach(k=>{
    const col=keys.length===1?'#1B3FA0':COLORS[KEYS.indexOf(k)%COLORS.length],pts=valid(SUB[k].s),last=pts[pts.length-1];
    if(keys.length===1){const m=pts.reduce((t,q)=>t+q[0],0)/pts.length;body+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(m)}" y2="${y(m)}" stroke="#5B6475" stroke-dasharray="5 4" stroke-width="1.5"/>`}
    body+=`<path d="${pts.map((q,i)=>(i?'L':'M')+x(q[1])+','+y(q[0])).join('')}" fill="none" stroke="${col}" stroke-width="${keys.length===1?3:2.5}" stroke-linejoin="round"/>`;
    pts.forEach(q=>{
      const isL=q===last;
      body+=`<circle cx="${x(q[1])}" cy="${y(q[0])}" r="${isL?5.5:3.5}" fill="${isL?'#FFE15A':'#fff'}" stroke="${col}" stroke-width="2.5"/>`;

  });

}

const LETTERS={A:'12',B:'13',C:'23',D:'123',E:'14',F:'24',G:'124',H:'34',I:'134',J:'234',K:'1234',L:'15',M:'25',N:'125',O:'35',P:'135',Q:'235',R:'1235',S:'45',T:'145',U:'245',V:'1245',W:'345',X:'1345',Y:'2345',Z:'12345'};
const typeGuess=n=>/수학/.test(n)?'math':/과학|물리|화학|생물|지구/.test(n)?'sci':/국어|영어|독해|문학/.test(n)?'lang':'memo';
function newImp(){

    rows:DEF().map(k=>({k,name:SUB[k].n,code:SUB[k].code||'',type:SUB[k].t,obj:'',wri:'',perf:'',total:'',count:'',wrong:''})),
    reported:{sum:'',avg:''},extras:[],checkMsgs:[],msg:'',ok:false,confirm:false,busy:false,newName:'',newType:'lang'};
}
const rowEmpty=r=>['obj','wri','perf','total','wrong'].every(f=>String(r[f]).trim()==='');
/* "5:2, 12:C, 18:?, 20" → 틀린 문항(고른 보기)·비운 문항. 표기는 성적표 범례를 따라요(알파벳은 복수 표기). */
function parseWrong(s){
  const wrong=[],blank=[],bad=[];
  String(s).split(/[\s,;]+/).filter(Boolean).forEach(tok=>{
    const m=tok.match(/^(\d{1,3})(?::([1-5]{1,5}|[A-Za-z]|\?))?$/);
    if(!m){bad.push(tok);return}
    const n=+m[1];if(n<1||n>100){bad.push(tok);return}
    const c=m[2];
    if(c==='?'){blank.push(n);return}
    let ch=[];
    if(c){const code=/[A-Za-z]/.test(c)?LETTERS[c.toUpperCase()]:c;ch=[...new Set(code.split('').map(Number))].sort()}
    wrong.push({n,chosen:ch});
  });
  return {wrong,blank,bad};
}
function checkImp(){
  const I=st.imp,bad=[];let sum=0,cnt=0;
  I.rows.forEach(r=>{
    if(rowEmpty(r))return;
    const o=+r.obj||0,w=+r.wri||0,p=+r.perf||0,t=o+w+p;sum+=t;cnt++;
    if(t>100)bad.push(`${r.name}: 객관식+서술형+실기가 100점을 넘어요`);
    if(String(r.total).trim()!==''&&+r.total!==t)bad.push(`${r.name}: 입력한 합 ${t}점, 성적표 총점 ${r.total}점`);
    if(String(r.wrong).trim()!==''){const p2=parseWrong(r.wrong);if(p2.bad.length)bad.push(`${r.name}: 읽을 수 없는 표기 ${p2.bad.join(', ')}`)}
  });
  if(String(I.reported.sum).trim()!==''&&+I.reported.sum!==sum)bad.push(`합계: 입력한 점수의 합 ${sum}점, 성적표 합계 ${I.reported.sum}점`);
  if(String(I.reported.avg).trim()!==''&&cnt&&Math.abs(+I.reported.avg-sum/cnt)>0.01)bad.push(`평균: 계산 ${(sum/cnt).toFixed(2)}, 성적표 평균 ${I.reported.avg}`);
  return {bad,sum,cnt};
}
function applyExtraction(j){
  const I=st.imp;
  I.exam={label:j.exam.label||'',gradeLevel:j.exam.gradeLevel?String(j.exam.gradeLevel):'',semester:j.exam.semester?String(j.exam.semester):'',kind:j.exam.kind||'midterm'};
  I.rows=I.rows.filter(r=>r.k).map(r=>({...r,obj:'',wri:'',perf:'',total:'',count:'',wrong:''}));
  j.subjects.forEach(s=>{
    let r=I.rows.find(x=>(s.code&&x.code===s.code)||x.name===s.name);
    if(!r){r={k:null,name:s.name,code:s.code||'',type:typeGuess(s.name),obj:'',wri:'',perf:'',total:'',count:'',wrong:''};I.rows.push(r)}
    const sv=v=>v==null?'':String(v);
    r.obj=sv(s.objective);r.wri=sv(s.written);r.perf=sv(s.performance);r.total=sv(s.reportedTotal);r.count=sv(s.itemCount);
    const parts=(s.wrong||[]).map(w=>w.chosen.length?`${w.n}:${w.chosen.join('')}`:String(w.n)).concat((s.blank||[]).map(n=>`${n}:?`));
    r.wrong=parts.join(', ');
  });
  I.reported={sum:j.reported&&j.reported.sum!=null?String(j.reported.sum):'',avg:j.reported&&j.reported.average!=null?String(j.reported.average):''};
  I.extras=(j.extras||[]).slice(0,50).map(x=>({label:x.label,value:x.value}));
}
async function remoteParse(){
  const I=st.imp,P=CONFIG.parser;
  if(P.mode!=='remote'||!P.endpoint)return;
  if(!I.files.length){I.msg='성적표 사진을 먼저 올려 주세요.';I.ok=false;return render()}
  I.busy=true;I.msg='읽는 중이에요…';I.ok=true;render();
  try{
    const fd=new FormData();I.files.forEach((f,i)=>fd.append('image'+i,f.file,'card'+i));
    const r=await fetch(P.endpoint,{method:'POST',body:fd,cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});

function commitImp(){
  const I=st.imp,e=I.exam,fail=m=>{I.msg=m;I.ok=false;render()};
  const label=e.label.trim();
  if(!label)return fail('시험 이름을 입력해 주세요.');
  if(piiHit(label))return fail(`${piiHit(label)}처럼 보이는 글은 쓸 수 없어요.`);
  if(TERMS.includes(label))return fail('같은 이름의 시험이 이미 있어요. 이름을 바꿔 주세요.');
  const gl=String(e.gradeLevel).trim();
  if(gl!==''&&!(/^\d{1,2}$/.test(gl)&&+gl>=1&&+gl<=12))return fail('학년은 1~12 사이 숫자로 적어 주세요.');
  const rows=I.rows.filter(r=>!rowEmpty(r));
  if(!rows.length)return fail('응시한 과목의 점수를 하나 이상 입력해 주세요.');
  for(const r of rows){
    for(const [f,l] of [['obj','객관식'],['wri','서술형'],['perf','실기'],['total','총점']]){
      const v=String(r[f]).trim();if(v!==''&&!(/^\d{1,3}$/.test(v)&&+v<=100))return fail(`${r.name}의 ${l} 점수는 0~100 사이 정수로 적어 주세요.`);
    }
    const c=String(r.count).trim();if(c!==''&&!(/^\d{1,3}$/.test(c)&&+c>=1&&+c<=100))return fail(`${r.name}의 문항 수는 1~100 사이 정수로 적어 주세요.`);
    if(String(r.wrong).trim()!==''){const p=parseWrong(r.wrong);if(p.bad.length)return fail(`${r.name}: 읽을 수 없는 표기가 있어요 (${p.bad.join(', ')})`)}
    if(piiHit(r.name))return fail(`${piiHit(r.name)}처럼 보이는 글은 쓸 수 없어요.`);
  }
  const ck=checkImp();I.checkMsgs=ck.bad;
  if(ck.bad.length&&!I.confirm){I.confirm=true;return fail('검산에서 차이가 발견됐어요. 사진과 다시 비교해 보고, 그래도 맞다면 한 번 더 눌러 주세요.')}
  const backup=JSON.stringify(toData());
  let n=TERMS.length+1;while(TERMIDS.includes('t'+n))n++;
  const id='t'+n,meta={kind:e.kind};
  if(gl!=='')meta.gradeLevel=+gl;if(e.semester)meta.semester=+e.semester;
  const rs=String(I.reported.sum).trim(),ra=String(I.reported.avg).trim();
  if(rs!==''||ra!==''){meta.reported={};if(rs!=='')meta.reported.sum=+rs;if(ra!=='')meta.reported.average=+ra}
  TERMS.push(label);TERMIDS.push(id);EXAMMETA[id]=meta;
  for(const k of DEF()){SUB[k].c.push(null);SUB[k].perf.push(null);SUB[k].rep.push(null)}
  const i=TERMIDS.length-1;
  rows.forEach(r=>{
    let k=r.k;
    if(!k){let m=DEF().length+1;while(SUB['s'+m])m++;k='s'+m;SUB[k]=newSub(r.name,r.type,r.code)}
    SUB[k].c[i]=[+r.obj||0,+r.wri||0];
    if(String(r.perf).trim()!=='')SUB[k].perf[i]=+r.perf;
    if(String(r.total).trim()!=='')SUB[k].rep[i]=+r.total;
    if(r.code&&!SUB[k].code)SUB[k].code=r.code;
    if(String(r.wrong).trim()!==''||String(r.count).trim()!==''){
      const p=parseWrong(r.wrong),it={exam:id,subject:k,wrong:p.wrong};
      if(String(r.count).trim()!=='')it.count=+r.count;if(p.blank.length)it.blank=p.blank;ITEMS[id+'|'+k]=it;
    }
  });
  I.extras.forEach(x=>EXTRAS.push({exam:id,label:x.label,value:x.value}));
  const v=validate(toData());
  if(v.errors.length){applyData(JSON.parse(backup));st.tab='record';st.imp=newImp();st.imp.msg='가져오지 못했어요: '+v.errors[0];return render()}
  const files=I.files;dirty=true;rebuild();
  st.imp=newImp();st.imp.files=files;st.imp.msg=`${label}을(를) 가져왔어요.`;st.imp.ok=true;
  render();
}
function delExam(i){
  if(CLASS&&CLASS.termIds.includes(TERMIDS[i])){st.del=-1;st.imp=st.imp||newImp();st.imp.msg='학급 비교에 쓰이는 시험은 삭제할 수 없어요.';st.imp.ok=false;return render()}
  if(st.del!==i){st.del=i;return render()}
  const id=TERMIDS[i];
  TERMS.splice(i,1);TERMIDS.splice(i,1);delete EXAMMETA[id];
  for(const k of DEF()){SUB[k].c.splice(i,1);SUB[k].perf.splice(i,1);SUB[k].rep.splice(i,1)}
  for(const key of Object.keys(ITEMS))if(key.startsWith(id+'|'))delete ITEMS[key];
  EXTRAS=EXTRAS.filter(x=>x.exam!==id);
  st.del=-1;dirty=true;rebuild();st.imp=newImp();st.imp.msg='삭제했어요.';st.imp.ok=true;render();
}

 '개념 혼동':{step:'교과서 개념을 다시 정리하고 예제 3문제 풀기',min:25},
 '계산 실수':{step:'풀이를 한 줄씩 쓰며 다시 풀고 검산하기',min:20},
 '문제 해석':{step:'조건에 밑줄 치고 "구하는 것"을 먼저 쓰기',min:15},
 '조건 확인 부족':{step:'지문 조건에 번호를 매기고 선지에 하나씩 적용하기',min:20},
 '시간 부족':{step:'시간을 재고 문항별 시간 배분 연습하기',min:20},
 '':{step:'틀린 이유를 먼저 분류하고 개념 복습하기',min:20}
};
function mkRows(n,old){return Array.from({length:n},(_,i)=>old&&old[i]?old[i]:{mine:null,key:null,unit:'',type:''})}
function exFrom(a){
  return {title:a.title,
   qs:a.questions.map(q=>({no:q.no,pts:q.points,topic:q.topic||'',stu:q.studentAnswer==null?null:q.studentAnswer,stuC:q.studentAnswerConfidence||'보통',key:q.key,keyC:q.keyConfidence||'보통',trace:q.trace||'',why:q.why||''})),
   tasks:(a.tasks||[]).map(t=>({q:t.q,t:t.text,min:t.minutes,onlyWrong:t.onlyWrongAtLeast||0})),
   strength:(a.coaching&&a.coaching.strength)||'',pattern:(a.coaching&&a.coaching.pattern)||''};
}
function exGrade(q){
  const m=(q.no in st.ex.mine)?st.ex.mine[q.no]:q.stu,off=st.ex.official[q.no],key=off||q.key,sure=!!off;
  return {mine:m,key,sure,res:m==null?'check':m===key?'ok':'x'};
}
function exView(){
  const v=st.ex.view;
  return v==='sample'?exSample():v==='entry'?exEntry():v==='result'?exResult():exHome();
}

function exResultData(){
  const E=st.ex,rows=E.rows.map((r,i)=>({no:i+1,...r}));
  const graded=rows.filter(r=>r.mine&&r.key),ok=graded.filter(r=>r.mine===r.key),wr=graded.filter(r=>r.mine!==r.key),unk=rows.filter(r=>!(r.mine&&r.key));
  const G={};
  wr.forEach(r=>{const u=(r.unit||'').trim()||'단원 미입력';const o=G[u]=G[u]||{u,nos:[],types:{}};o.nos.push(r.no);o.types[r.type]=(o.types[r.type]||0)+1});
  const groups=Object.values(G).sort((a,b)=>b.nos.length-a.nos.length),tasks=[];
  groups.slice(0,3).forEach(o=>{
    const top=Object.entries(o.types).sort((a,b)=>b[1]-a[1])[0][0],tip=ETIP[top];
    tasks.push({t:`${o.u}: ${tip.step}`,min:tip.min});
    tasks.push({t:`${o.u}: 틀린 ${o.nos.map(n=>n+'번').join(', ')} 다시 풀기`,min:Math.min(25,5+5*o.nos.length)});
  });
  if(unk.length)tasks.push({t:`채점하지 못한 ${unk.length}문항을 정답지로 채점하기`,min:10});
  if(wr.length)tasks.push({t:'해설을 보고 틀린 이유를 오답 노트에 적기',min:15});
  let day=1,acc=0;tasks.forEach(k=>{if(acc>0&&acc+k.min>40){day++;acc=0}k.day=day;acc+=k.min});
  return {rows,graded,ok,wr,unk,groups,tasks};
}

  const tot=R.tasks.reduce((s,t)=>s+t.min,0),dn=R.tasks.filter((t,i)=>E.done2[i]).reduce((s,t)=>s+t.min,0);
  const plan=Object.entries(days).map(([d,arr])=>`<div class="day"><b>${dl(+d)}</b> <span class="sub">${arr.reduce((s,x)=>s+x[0].min,0)}분</span>${arr.map(([t,i])=>`<button class="task" role="checkbox" aria-checked="${!!E.done2[i]}" data-ex-task2="${i}"><span class="box">${E.done2[i]?'✓':''}</span><span><span class="t">${esc(t.t)}</span><br><span class="d">${t.min}분</span></span></button>`).join('')}</div>`).join('');
  return `<button class="btn small" data-ex="back" style="margin:0 0 8px">← 답 입력</button><h1>채점 결과</h1>
  <p class="sub">${R.graded.length}문항 채점 · 맞음 ${R.ok.length} · 틀림 ${R.wr.length} · 정답률 ${pct}%${R.unk.length?` · 채점 못함 ${R.unk.length}`:''}</p>
  ${R.unk.length?`<div class="pen blue"><b>정답이나 내 답이 비어 있는 문항이 ${R.unk.length}개 있어요</b><br>${R.unk.map(r=>r.no+'번').join(', ')}은 채점에서 빠졌어요.</div>`:''}

  <h2>보강 계획 (${dn}/${tot}분)</h2>

/* ===== 학사 일정 · AI 결과 가져오기 · 암호화 ===== */
function isDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return false;const d=new Date(+m[1],+m[2]-1,+m[3]);return d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[3]}
function dday(s){const t=new Date(isoToday()+'T00:00:00'),d=new Date(s+'T00:00:00');return Math.round((d-t)/86400000)}
function scheduleCard(edit){
  const list=SCHEDULE.map((e,i)=>({e,i})).filter(x=>dday(x.e.endDate||x.e.date)>=0).sort((a,b)=>a.e.date<b.e.date?-1:a.e.date>b.e.date?1:0).slice(0,4);
  if(!list.length)return edit?'<h2>다가오는 일정</h2><p class="sub">등록된 일정이 없어요. Claude에게 학교 학사 일정을 찾아 달라고 한 뒤, 결과를 "AI 결과 가져오기"에 붙여 넣어 주세요.</p>':'';
  const md=s=>s.slice(5).replace('-','/');
  return `<h2>다가오는 일정</h2>${list.map(({e,i})=>{
    const dd=dday(e.date),lab=dd>0?`D-${dd}`:dd===0?'오늘':'진행 중';
    return `<div class="ev"><span class="dd">${lab}</span><span><b>${esc(e.title)}</b> <span class="tag">${SCAT[e.category]}</span><br><span class="sub">${md(e.date)}${e.endDate?' ~ '+md(e.endDate):''}${e.confirmed?'':' · AI가 수집, 확인 필요'}</span></span>${edit?`<span class="evb">${e.confirmed?'':`<button class="btn small" data-sch="ok:${i}">맞아요</button>`}<button class="btn small" data-sch="del:${i}" aria-label="일정 삭제">삭제</button></span>`:''}</div>`}).join('')}`;
}
/* Claude 앱 등 AI 도구가 만든 결과를 붙여 넣어 가져와요. 형식: {"kind":..., "schemaVersion":3, "payload":...} */
function aiBox(){
  return `<div class="card"><b>AI 결과 가져오기</b><p class="sub">Claude 앱이 만들어 준 결과(JSON)를 붙여 넣어 주세요. 성적표, 학사 일정, 시험지 판정 결과를 알아서 구분해요.</p>
  <textarea id="ai-text" class="in" rows="4" placeholder='{"kind":"reportCard", ...}' aria-label="AI 결과 붙여넣기">${esc(st.aiText||'')}</textarea>
  <div class="btns"><button class="btn small" data-ai="paste">클립보드에서 붙여넣기</button><button class="btn main small" data-ai="go">가져오기</button></div>
  <p class="${st.aiOk?'up':'down'}" role="status" style="font-size:13.5px;margin-top:6px">${esc(st.aiMsg||'')}</p></div>`;
}
function handleAI(raw){
  const fail=m=>{st.aiMsg=m;st.aiOk=false;render()},win=m=>{st.aiMsg=m;st.aiOk=true;st.aiText='';render()};
  let j;
  try{j=JSON.parse(String(raw).trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''))}
  catch(e){return fail('JSON 형식이 아니에요. Claude가 준 결과를 처음부터 끝까지 그대로 붙여 넣어 주세요.')}
  if(!j||typeof j!=='object'||typeof j.kind!=='string'||!j.payload||typeof j.payload!=='object')return fail('kind와 payload가 있는 결과가 아니에요.');
  if(Number.isInteger(j.schemaVersion)&&j.schemaVersion>VERSION)return fail(`더 새로운 형식(v${j.schemaVersion})이에요. 프로그램을 업데이트해 주세요(지금 v${VERSION}).`);

    st.role='S';st.tab='wrong';return win('시험지 판정 결과를 가져왔어요.');
  }

}

/* 암호화: 비밀번호로 AES-256-GCM(PBKDF2-SHA256). 비밀번호는 이 화면에서만 입력해요. */
const ENC_FORMAT='school-coach-encrypted';
const CLAUDE_PROMPT="아래 규칙으로 첨부한 성적표 사진을 읽어서 JSON만 출력해 주세요.\n1. 사진에 이름·학번·학교 이름·반·번호가 보이면 작업을 멈추고, 가려서 다시 올려 달라고 말해 주세요. 결과에도 그런 정보를 쓰지 마세요.\n2. 출력은 코드 블록 하나의 JSON만, 형식은 다음과 같아요.\n{\"kind\":\"reportCard\",\"schemaVersion\":3,\"payload\":{\"exam\":{\"label\":\"시험 이름\",\"gradeLevel\":3,\"semester\":2,\"kind\":\"midterm\"},\"subjects\":[{\"name\":\"국어\",\"code\":\"01\",\"objective\":76,\"written\":20,\"performance\":0,\"reportedTotal\":96,\"itemCount\":45,\"wrong\":[{\"n\":6,\"chosen\":[2]}],\"blank\":[]}],\"reported\":{\"sum\":657,\"average\":93.86},\"extras\":[]}}\n   kind는 midterm(중간)·final(기말)·quiz(단원평가)·mock(모의고사)·other 중 하나예요. 학기·학년을 모르면 생략하세요.\n3. 객관식은 objective, 주관식·서술형은 written, 실기는 performance(없으면 생략), 성적표의 과목 총점은 reportedTotal, 합계·평균은 reported에 넣어 주세요.\n4. 문항 표에서 점(.)은 맞음, 숫자는 틀린 문항에서 고른 보기, ?는 비운 문항이에요. 알파벳은 복수 표기예요: A=12, B=13, C=23, D=123, E=14, F=24, G=124, H=34, I=134, J=234, K=1234, L=15, M=25, N=125, O=35, P=135, Q=235, R=1235, S=45, T=145, U=245, V=1245, W=345, X=1345, Y=2345, Z=12345. 확신이 없으면 문항 표는 빼고 점수만 주세요.\n5. 과목마다 객관식+서술형+실기가 과목 총점과 같은지, 총점의 합이 합계와 같은지, 평균이 맞는지 스스로 검산하세요. 안 맞으면 사진을 다시 읽어 고치세요.\n6. 위 형식에 없는 항목이 성적표에 있으면 extras에 {\"label\":\"항목 이름\",\"value\":\"값\"}으로 넣어 주세요(이름·학번 제외).\n7. 읽기 어려운 칸은 비워 두고, JSON 아래에 불확실한 곳을 짧게 적어 주세요.";
const b64e=u8=>{let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt,iter){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptObj(obj,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=310000;
  const key=await deriveKey(pass,salt,iter);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return {format:ENC_FORMAT,v:1,kdf:'PBKDF2-SHA256',iter,cipher:'AES-256-GCM',salt:b64e(salt),iv:b64e(iv),data:b64e(ct)};
}
async function decryptEnv(env,pass){
  if(!env||env.v!==1||!Number.isInteger(env.iter)||env.iter<100000||env.iter>2000000||typeof env.salt!=='string'||typeof env.iv!=='string'||typeof env.data!=='string')throw new Error('bad');
  const key=await deriveKey(pass,b64d(env.salt),env.iter);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(env.iv)},key,b64d(env.data));
  return new TextDecoder().decode(pt);
}
function encUI(){
  const E=st.enc;if(!E)return '';
  const msg=`<p id="enc-msg" class="down" role="status" style="font-size:13.5px">${esc(E.msg||'')}</p>`;

async function encAction(a){
  const E=st.enc;
  if(a==='cancel'){st.enc=null;return render()}
  if(!E)return;
  const say=m=>{E.msg=m;const el=$('enc-msg');if(el)el.textContent=m};
  if(!(globalThis.crypto&&crypto.subtle))return say('이 환경에서는 암호화를 쓸 수 없어요. HTTPS 주소에서 열어 주세요.');
  try{
    if(a==='do'){
      const p1=$('enc-p1').value,p2=$('enc-p2').value;
      if(p1.length<8)return say('비밀번호는 8자 이상으로 정해 주세요.');
      if(p1!==p2)return say('비밀번호 확인이 달라요.');
      const d=toData(),v=validate(d);
      if(v.errors.length){st.enc=null;st.data.result={name:'암호화 전 검사',errors:v.errors,warns:v.warns};return render()}
      const env=await encryptObj(d,p1);
      $('enc-p1').value='';$('enc-p2').value='';
      download(`coach-data-${META.dataset||'data'}.enc.json`,env);dirty=false;st.enc=null;render();
    }else if(a==='open'){
      const p=$('enc-p').value;let plain;
      try{plain=await decryptEnv(E.env,p)}catch(e){return say('비밀번호가 맞지 않거나 파일이 손상됐어요.')}
      $('enc-p').value='';st.enc=null;ingest(plain,String(E.name).replace(/\.enc(\.json)?$/,'')+'.json',plain.length);
    }
  }catch(e){say('처리하지 못했어요.')}
}

/* 파일 문자열을 형식 검사 후 불러와요. 폴더에서 열든 직접 고르든 같은 경로를 써요. */
function ingest(text,name,size){
  const r={name:String(name).replace(/[<>]/g,''),errors:[],warns:[]};
  if(size>3*1024*1024)r.errors.push('파일이 너무 커요(3MB 이하만 받아요)');
  else{
    let d;try{d=JSON.parse(text)}catch(e){r.errors.push('JSON 형식이 아니에요. 파일 내용을 확인해 주세요.')}
    if(d&&typeof d==='object'&&d.format===ENC_FORMAT){st.enc={mode:'load',env:d,name:r.name,msg:''};st.data.result=null;st.role='D';return render()}
    if(d!==undefined){
      const v0=d&&typeof d==='object'?d.schemaVersion:null;
      if(Number.isInteger(v0)&&v0>VERSION)r.errors.push(`더 새로운 형식(v${v0})의 파일이에요. 프로그램을 업데이트해 주세요(지금 v${VERSION}).`);
      else{
        d=migrate(d);const v=validate(d);r.errors=v.errors;r.warns=v.warns;
        if(!v.errors.length){
          if(Number.isInteger(v0)&&v0<VERSION)r.warns.unshift(`이전 형식(v${v0}) 파일이라 최신 형식(v${VERSION})으로 바꿔서 불러왔어요`);
          applyData(d);dirty=Number.isInteger(v0)&&v0<VERSION;st.role='D';
        }
      }
    }
  }
  st.data.result=r;render();
}

  if(p.mode==='remote'&&typeof p.endpoint==='string'&&/^(https:\/\/|\.?\/)[^\s]{1,300}$/.test(p.endpoint)){CONFIG.parser={mode:'remote',endpoint:p.endpoint}}
}
async function boot(){
  readHashLink();
  try{const r=await fetch('config.json',{cache:'no-store'});if(r.ok)applyConfig(await r.json())}catch(e){}
  try{
    const r=await fetch('data/index.json',{cache:'no-store'});if(!r.ok)throw new Error();
    const ix=await r.json();
    INDEX=(ix&&Array.isArray(ix.datasets)?ix.datasets:[]).filter(x=>x&&typeof x.file==='string'&&SAFE_FILE.test(x.file)).slice(0,50).map(x=>({file:x.file,title:String(x.title||x.file).slice(0,40)}));
  }catch(e){INDEX=null}
  render();
}
function exportData(){
  const d=toData(),v=validate(d);
  if(v.errors.length){st.data.result={name:'내보내기 전 검사',errors:v.errors,warns:v.warns};st.role='D';return render()}
  download(`coach-data-${META.dataset||'data'}.json`,d);dirty=false;
}
/* 스키마 개정 근거: 값은 빼고 항목 이름·값의 종류·개수만 담아요 */
function extrasReport(){
  const all=EXTRAS.concat(st.imp?st.imp.extras:[]),m={};
  all.forEach(x=>{const t=/^-?\d+(\.\d+)?$/.test(String(x.value))?'number':'text';const k=x.label+'|'+t;m[k]=m[k]||{label:x.label,valueType:t,count:0};m[k].count++});
  return {kind:'schema-suggestion',appVersion:APP_VERSION,schemaVersion:VERSION,createdAt:isoToday(),fields:Object.values(m)};
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-role],[data-tab],[data-subj],[data-task],[data-go],[data-pick],[data-share],[data-copy],[data-sel],[data-selall],[data-avg],[data-multi],[data-del],[data-d],[data-ex],[data-ex-task],[data-ex-task2],[data-ex-rm],[data-imp-act],[data-ai],[data-enc],[data-sch],[data-reload]');
  if(!t)return;
  const d=t.dataset,E=st.ex;
  if(d.reload!==undefined)return location.reload();
  if(d.enc){encAction(d.enc);return}
  if(d.ai){
    if(d.ai==='prompt'){
      const fin=ok=>{st.aiMsg=ok?'요청문을 복사했어요. Claude 앱에 붙여 넣고, 이름을 가린 성적표 사진을 함께 올리세요. 받은 결과는 "AI 결과 가져오기"에 붙여 넣으세요.':'복사하지 못했어요. "요청문 보기"를 열어 직접 복사해 주세요.';st.aiOk=ok;render()};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(CLAUDE_PROMPT).then(()=>fin(true)).catch(()=>fin(false));else fin(false);
      return;
    }
    if(d.ai==='go'){const el=$('ai-text');if(el)st.aiText=el.value;return handleAI(st.aiText)}
    if(d.ai==='paste'){
      if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(x=>{st.aiText=x;st.aiMsg='';render()}).catch(()=>{st.aiMsg='클립보드를 읽지 못했어요. 칸을 길게 눌러 직접 붙여 넣어 주세요.';st.aiOk=false;render()});
      else{st.aiMsg='클립보드를 읽을 수 없어요. 칸을 길게 눌러 직접 붙여 넣어 주세요.';st.aiOk=false;render()}
      return;
    }
  }
  if(d.sch!==undefined){const [a,i]=d.sch.split(':'),e=SCHEDULE[+i];if(e){if(a==='ok')e.confirmed=true;else if(a==='del')SCHEDULE.splice(+i,1);dirty=true}return render()}
  if(d.del!==undefined)return delExam(+d.del);
  if(d.impAct){
    const I=st.imp||(st.imp=newImp()),[a,arg]=d.impAct.split(':');
    if(a==='rmfile'){const f=I.files.splice(+arg,1)[0];if(f&&f.url)URL.revokeObjectURL(f.url)}
    else if(a==='addrow'){
      const nm=I.newName.trim();
      if(!nm){I.msg='과목 이름을 입력해 주세요.';I.ok=false}
      else if(piiHit(nm)){I.msg=`${piiHit(nm)}처럼 보이는 글은 쓸 수 없어요.`;I.ok=false}
      else if(I.rows.some(r=>r.name===nm)){I.msg='같은 이름의 과목이 이미 있어요.';I.ok=false}
      else{I.rows.push({k:null,name:nm,code:'',type:I.newType,obj:'',wri:'',perf:'',total:'',count:'',wrong:''});I.newName='';I.msg='';}
    }
    else if(a==='rmrow')I.rows.splice(+arg,1);
    else if(a==='check'){const c=checkImp();I.checkMsgs=c.bad;I.msg=c.bad.length?'':(c.cnt?'검산을 통과했어요. 입력한 값이 성적표와 일치해요.':'입력된 과목이 없어요.');I.ok=!c.bad.length&&c.cnt>0;I.confirm=false}
    else if(a==='commit')return commitImp();
    else if(a==='parse')return remoteParse();
    else if(a==='reset'){revokeFiles(I.files);st.imp=newImp()}
    return render();
  }
  if(d.d){
    if(d.d==='template')download('template-empty.json',templateData());
    else if(d.d==='new')return startNew();
    else if(d.d==='export')return exportData();
    else if(d.d==='extras')download('schema-suggestion.json',extrasReport());
    else if(d.d==='open')return openDataset(d.file||'');
    else if(d.d==='encsave'){st.enc={mode:'save',msg:''}}
    else if(d.d==='clear'){clearAll()}
  }
  else if(d.role){st.role=d.role===st.role&&d.role==='D'?'S':d.role;st.pick=0}
  else if(d.tab){st.tab=d.tab;st.del=-1}
  else if(d.subj)st.subj=d.subj;
  else if(d.go){st.subj=d.go;st.tab='analysis'}
  else if(d.task){done.has(d.task)?done.delete(d.task):done.add(d.task)}
  else if(d.pick!==undefined)st.pick=+d.pick;
  else if(d.share){share[d.share]=!share[d.share]}
  else if(d.sel){
    if(!st.multi)st.sel=[d.sel];
    else{const n=st.sel.includes(d.sel)?st.sel.filter(x=>x!==d.sel):[...st.sel,d.sel];st.sel=n.length?n:st.sel}
  }
  else if(d.selall){st.multi=true;st.sel=[...KEYS]}
  else if(d.multi){st.multi=!st.multi;if(!st.multi)st.sel=[st.sel[0]||KEYS[0]]}
  else if(d.avg)st.avg=!st.avg;
  else if(d.copy){const el=$('draft');if(el&&navigator.clipboard)navigator.clipboard.writeText(el.textContent).catch(()=>{});t.textContent='복사했어요';return}
  else if(d.exTask!==undefined){const i=d.exTask;E.done[i]=!E.done[i]}
  else if(d.exTask2!==undefined){const i=d.exTask2;E.done2[i]=!E.done2[i]}
  else if(d.exRm!==undefined){const [k,i]=d.exRm.split(':');const f=E.files[k].splice(+i,1)[0];if(f&&f.url)URL.revokeObjectURL(f.url)}
  else if(d.ex==='open'){E.view='sample';E.i=+(d.exI||0)}
  else if(d.ex==='close'){E.view='home';E.msg=''}
  else if(d.ex==='start'){
    if(!(E.files.exam.length&&E.files.ans.length))E.msg='시험지와 답안지를 먼저 올려 주세요.';
    else{E.msg='';E.view='entry'}
  }
  else if(d.ex==='toresult'){E.done2={};E.view='result'}
  else if(d.ex==='back'){E.view='entry'}
  else if(d.ex==='regroup'){E.done2={}}
  else if(d.ex==='reset'){E.official={};E.mine={};E.done={}}
  render();
});
document.addEventListener('change',e=>{
  const t=e.target,E=st.ex;
  if(t.id==='f-data'){const f=t.files&&t.files[0];t.value='';if(f)loadFile(f);return}
  if(t.id==='imp-file'||t.id==='imp-cam'){
    const I=st.imp||(st.imp=newImp());
    [...t.files].forEach(f=>I.files.push({name:f.name,pdf:f.type==='application/pdf',url:URL.createObjectURL(f),file:f}));
    t.value='';render();return;
  }
  if(t.id&&t.id.startsWith('u-')&&t.files){
    const k=t.id.slice(2).replace('-cam','');
    [...t.files].forEach(f=>E.files[k].push({name:f.name,pdf:f.type==='application/pdf',url:URL.createObjectURL(f)}));
    t.value='';E.msg='';render();return;
  }
  if(t.id==='ex-n'){const n=Math.max(1,Math.min(60,+t.value||20));E.n=n;E.rows=mkRows(n,E.rows);render();return}
  if(!t.dataset)return;
  if(t.dataset.imp&&st.imp){
    const I=st.imp,p=t.dataset.imp.split(':');
    if(p[0]==='r'){I.rows[+p[1]][p[2]]=t.value}
    else if(p[0]==='exam.label')I.exam.label=t.value;
    else if(p[0]==='exam.gradeLevel')I.exam.gradeLevel=t.value;
    else if(p[0]==='exam.semester')I.exam.semester=t.value;
    else if(p[0]==='exam.kind')I.exam.kind=t.value;
    else if(p[0]==='rep.sum')I.reported.sum=t.value;
    else if(p[0]==='rep.avg')I.reported.avg=t.value;
    else if(p[0]==='newName')I.newName=t.value;
    else if(p[0]==='newType')I.newType=t.value;
    I.confirm=false;return;
  }
  if(t.dataset.exr!==undefined){
    const [i,f]=t.dataset.exr.split(':'),r=E.rows[+i];
    if(f==='unit'&&piiHit(t.value)){t.value='';return}
    r[f]=(f==='mine'||f==='key')?(t.value?+t.value:null):t.value;return;
  }
  if(t.dataset.exMine!==undefined){E.mine[t.dataset.exMine]=t.value?+t.value:null;render()}
  else if(t.dataset.exOff!==undefined){if(t.value)E.official[t.dataset.exOff]=+t.value;else delete E.official[t.dataset.exOff];render()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='ai-text'){st.aiText=t.value;return}
  if(t.dataset&&t.dataset.goal){goals[t.dataset.goal]=+t.value;const v=$('view').scrollTop;render();$('view').scrollTop=v;const el=document.querySelector(`[data-goal="${t.dataset.goal}"]`);el&&el.focus()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.pick!==undefined)e.target.click()});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
window.addEventListener('pagehide',()=>{for(const k of Object.keys(st.ex.files))st.ex.files[k].forEach(f=>f.url&&URL.revokeObjectURL(f.url));if(st.imp)st.imp.files.forEach(f=>f.url&&URL.revokeObjectURL(f.url))});

/* 시작: 데이터 없이 시작하고, 같은 위치의 config.json·data/index.json만 읽어요. */
st.role='D';
render();
boot();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  const hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtrl&&$('upd'))$('upd').hidden=false});
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
